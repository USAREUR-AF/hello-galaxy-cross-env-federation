<text x="326.8" y="346.5" class="ton" font-size="13" text-anchor="middle" font-weight="700">03, 04</text>
<text x="361.6" y="347.3" class="t" font-size="15" font-weight="700">One agreement, one digest</text>
<text x="300" y="374" class="tq" font-size="14">same digest on both sides, in either order</text>
<text x="300" y="398.4" class="tq" font-size="14">a changed field is named</text>
<rect x="32" y="322.8" width="204" height="79.3" rx="8" class="bx"/>
<text x="44" y="349.8" class="t" font-size="15" font-weight="700">Checked by voice</text>
<text x="44" y="369.5" class="tq" font-size="14">the other side's key and</text>
<text x="44" y="388.9" class="tq" font-size="14">CA fingerprint, read aloud</text>
<rect x="644" y="322.8" width="204" height="79.3" rx="8" class="bx"/>
<text x="656" y="349.8" class="t" font-size="15" font-weight="700">Checked by voice</text>
<text x="656" y="369.5" class="tq" font-size="14">the other side's key and</text>
<text x="656" y="388.9" class="tq" font-size="14">CA fingerprint, read aloud</text>
