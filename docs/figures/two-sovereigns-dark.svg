<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 610" width="880" height="610" role="img" aria-label="Two notional sovereigns, xaa and xab, each keep their own goatnet, certificate authority and identity plane. Each publishes a signed half-agreement, its pointer, package and CA certificate through the saltlick directory, which is public and grants nothing. Both compose the halves into one agreement with the same digest in either order, and a changed field is named. Each side runs a federation edge holding exactly one foreign authority; the tunnel between them comes up under derived names and data crosses both ways, read back from storage. Stages 01 to 05b run offline on one machine; 06 to 12 need two goatnets."><title>Two sovereigns exchange data without joining each other's networks</title><style>svg{--ink:#e7e9ec; --quiet:#a5acb7; --rule:#30363e; --line:#7b8592; --paper:#121417; --panel:#1a1d21; --accent:#6cc3da; --accent-soft:#14303a; --on-accent:#121417; --good:#6fc480; --good-bg:#1b2e20; --warn:#e2b04e; --warn-bg:#32291a; --info:#86b3ea; --info-bg:#1a2636; --crit:#f08b80; --crit-bg:#3a1f1f; font-family:'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif}.t{fill:var(--ink)} .tq{fill:var(--quiet)} .ta{fill:var(--accent)} .tg{fill:var(--good)}
.tw{fill:var(--warn)} .ti{fill:var(--info)} .tc{fill:var(--crit)} .ton{fill:var(--on-accent)}
.bx{fill:var(--panel);stroke:var(--line);stroke-width:1.25} .bxa{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.bxg{fill:var(--good-bg);stroke:var(--good);stroke-width:1.25} .bxc{fill:var(--crit-bg);stroke:var(--crit);stroke-width:1.25}
.bxw{fill:var(--warn-bg);stroke:var(--warn);stroke-width:1.25} .bxi{fill:var(--info-bg);stroke:var(--info);stroke-width:1.25}
.zone{fill:none;stroke:var(--line);stroke-width:1.25;stroke-dasharray:6 5}
.ln{stroke:var(--line);stroke-width:1.5;fill:none} .lna{stroke:var(--accent);stroke-width:2.25;fill:none}
.lng{stroke:var(--good);stroke-width:2;fill:none} .lnc{stroke:var(--crit);stroke-width:2;fill:none;stroke-dasharray:4 4}
.lni{stroke:var(--info);stroke-width:2;fill:none} .lnr{stroke:var(--rule);stroke-width:1;fill:none}
.fa{fill:var(--accent)} .fl{fill:var(--line)} .fg{fill:var(--good)} .fc{fill:var(--crit)} .fi{fill:var(--info)}
.halo{paint-order:stroke fill;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}</style>
<text x="24" y="38" class="t" font-size="20" font-weight="700" data-role="note">Two sovereigns exchange data without joining each other's networks</text>
<text x="24" y="66" class="tq" font-size="15" data-role="note">Each side keeps its own network, certificate authority and identity plane. They agree on one document, prove they</text>
<text x="24" y="87" class="tq" font-size="15" data-role="note">hold the same one, and connect only through an edge built for that partner.</text>
<text x="36" y="137" class="t" font-size="16" font-weight="700">Sovereign xaa</text>
<text x="36" y="157" class="tq" font-size="14">own CA, own identity plane</text>
<text x="648" y="137" class="t" font-size="16" font-weight="700">Sovereign xab</text>
<text x="648" y="157" class="tq" font-size="14">own CA, own identity plane</text>
<rect x="32" y="175" width="204" height="79.3" rx="8" class="bx"/>
<text x="44" y="202" class="t" font-size="15" font-weight="700">Signed half</text>
<text x="44" y="221.7" class="tq" font-size="14">its pointer, package and</text>
<text x="44" y="241" class="tq" font-size="14">CA certificate</text>
<rect x="644" y="175" width="204" height="79.3" rx="8" class="bx"/>
<text x="656" y="202" class="t" font-size="15" font-weight="700">Signed half</text>
<text x="656" y="221.7" class="tq" font-size="14">its pointer, package and</text>
<text x="656" y="241" class="tq" font-size="14">CA certificate</text>
<rect x="288" y="175" width="304" height="98.3" rx="8" class="bx"/>
<rect x="300" y="188.6" width="61.8" height="30" rx="15" class="fa"/>
<text x="330.9" y="208.2" class="ton" font-size="13" text-anchor="middle" font-weight="700">05, 05b</text>
<text x="369.8" y="209" class="t" font-size="15" font-weight="700">saltlick directory</text>
<text x="300" y="235.7" class="tq" font-size="14">public, outside both networks</text>
<text x="300" y="260" class="tq" font-size="14">listing grants nothing</text>
