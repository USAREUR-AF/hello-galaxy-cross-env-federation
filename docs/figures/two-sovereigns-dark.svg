<text x="335" y="468.7" class="t" font-size="14">tunnel under derived names</text>
<text x="328" y="511.7" class="tq" font-size="13" font-family="Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace">fed.&lt;issuer&gt;.&lt;counterparty&gt;.01</text>
<rect x="294" y="520.7" width="31" height="30" rx="15" class="fa"/>
<text x="309.5" y="540.3" class="ton" font-size="13" text-anchor="middle" font-weight="700">09</text>
<text x="335" y="540.7" class="t" font-size="14">data both ways, read back from storage</text>
